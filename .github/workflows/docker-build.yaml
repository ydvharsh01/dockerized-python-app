name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t yadavharsh01/devops-app:latest .
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.yadavharsh01 }}
          password: ${{ secrets.yadavji3386 }}

      - name: Push Image to Docker Hub
        run: docker push yadavharsh01/devops-app:latest