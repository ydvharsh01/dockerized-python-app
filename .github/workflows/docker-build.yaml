name: Build Docker Image

# Ye pipeline tab chalega jab bhi 'main' branch par code push hoga
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub humein ek free Linux server dega

    steps:
      # Step 1: Humara code GitHub se download karo
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Humari Dockerfile padh kar image build karo
      - name: Build Docker Image
        run: docker build -t devops-app-test .
        
      # Step 3: Check karo ki image successfully ban gayi ya nahi
      - name: Test Docker Image
        run: docker images
